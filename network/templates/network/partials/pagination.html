{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}<a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if query %}&q={{ query|urlencode }}{% endif %}" aria-label="Previous page">← Previous</a>{% else %}<span class="page-link disabled">← Previous</span>{% endif %}
  <span class="page-count">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="page-link" href="?page={{ page_obj.next_page_number }}{% if query %}&q={{ query|urlencode }}{% endif %}" aria-label="Next page">Next →</a>{% else %}<span class="page-link disabled">Next →</span>{% endif %}
</nav>
{% endif %}
